# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Publish To Maven Central

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Start MeiliSearch
      run: docker run -d -p 7700:7700 -e MEILI_ENV='development' -e MEILI_MASTER_KEY='MASTER_KEY' getmeili/meilisearch:v1.11.0-rc.0

    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808 # v4

    - name: Build with Gradle Wrapper
      run: bash ./gradlew build -x test

    - name: Run tests with Gradle Wrapper
      run: bash ./gradlew test

    - name: Write environment variables to file
      run: |
        echo "sonatype.username=${{ secrets.SONATYPE_USERNAME }}" >> sonatype.properties
        echo "sonatype.password=${{ secrets.SONATYPE_PASSWORD }}" >> sonatype.properties
        echo "signing.keyId=${{ secrets.SIGNING_KEY_ID }}" >> sonatype.properties
        echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> sonatype.properties
        echo "signing.secretKeyBase64=${{ secrets.SIGNING_SECRET_KEY_BASE64 }}" >> sonatype.properties

    # The USERNAME and TOKEN need to correspond to the credentials environment variables used in
    # the publishing section of your build.gradle
    - name: Publish to GitHub Packages
      run: ./gradlew publishGprPublicationToSonatype-centralRepository
